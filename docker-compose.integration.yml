# Dedicated PostgreSQL instance for automated integration tests only.
# Does not reference the GaragePro production containers, network or named volumes.
services:
  dbtest:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: garagepro_integration_test
      POSTGRES_USER: garagepro_test
      POSTGRES_PASSWORD: garagepro_test_pwd
    ports:
      - "127.0.0.1:55432:5432"
    # No named volume: database files disappear when this TEST container stops.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagepro_test -d garagepro_integration_test"]
      interval: 3s
      timeout: 3s
      retries: 20
